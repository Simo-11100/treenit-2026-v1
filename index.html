<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4285f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Treenit" />
  <title>Suoritukset 2026</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
    .card { max-width: 520px; margin: 0 auto; padding: 16px; border: 1px solid #e5e5e5; border-radius: 16px; background: white; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
    input, select, textarea, button {
      width: 100%; box-sizing: border-box; margin-top: 6px;
      padding: 12px; font-size: 16px; border-radius: 12px; border: 1px solid #ddd;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4285f4; }
    textarea { min-height: 84px; resize: vertical; }
    button { margin-top: 14px; cursor: pointer; background: #4285f4; color: white; border: none; font-weight: 600; }
    button:active { background: #3367d6; }
    .status { margin-top: 12px; font-size: 14px; }
    .status.error { color: #d93025; }
    .status.success { color: #1e8e3e; }
    .memeWrap { margin-top: 14px; display: none; padding: 16px; background: #fffbeb; border: 2px solid #fbbf24; border-radius: 16px; }
    .memeWrap img { width: 100%; border-radius: 12px; margin-top: 8px; }
    .memeTitle { font-size: 16px; font-weight: 600; }
    #memeText { margin-top: 10px; font-size: 15px; line-height: 1.5; color: #333; }
    .small { color: #666; font-size: 12px; margin-top: 6px; }
    .secret-row { display: flex; gap: 10px; align-items: flex-end; }
    .secret-row > div:first-child { flex: 1; }
    .secret-saved { font-size: 11px; color: #1e8e3e; margin-top: 4px; }
    
    .user-select { display: flex; gap: 12px; margin-top: 8px; }
    .user-select label {
      flex: 1;
      margin: 0;
      padding: 14px 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .user-select input[type="radio"] {
      display: none;
    }
    .user-select input[type="radio"]:checked + label {
      border-color: #4285f4;
      background: #e8f0fe;
      color: #1a73e8;
    }
    .user-select label:active {
      transform: scale(0.98);
    }

    .tag-select { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      margin-top: 8px; 
    }
    .tag-select label {
      margin: 0;
      padding: 12px 8px;
      border: 2px solid #ddd;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tag-select input[type="radio"] {
      display: none;
    }
    .tag-select input[type="radio"]:checked + label {
      border-color: #34a853;
      background: #e6f4ea;
      color: #1e8e3e;
    }
    .tag-select label:active {
      transform: scale(0.98);
    }

    .date-row { margin-top: 12px; }

    /* Minutes section */
    .minutes-section { margin-top: 16px; }
    .minutes-display {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a73e8;
      padding: 12px;
      background: #e8f0fe;
      border-radius: 12px;
      margin: 8px 0 12px 0;
    }
    .minutes-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .minutes-buttons button {
      margin: 0;
      padding: 14px 8px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      width: 100%;
    }
    .minutes-buttons .btn-plus {
      background: #34a853;
      color: white;
    }
    .minutes-buttons .btn-plus:active {
      background: #2d8f47;
    }
    .minutes-buttons .btn-minus {
      background: #ea4335;
      color: white;
    }
    .minutes-buttons .btn-minus:active {
      background: #c5352a;
    }
    .minutes-reset {
      margin-top: 8px;
      background: #9aa0a6;
      font-size: 14px;
      padding: 10px;
    }
    .minutes-reset:active {
      background: #80868b;
    }

    /* Stats section */
    .stats-section {
      margin-top: 16px;
      padding: 16px;
      background: #f0f4f9;
      border-radius: 12px;
      display: none;
    }
    .stats-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1a73e8;
    }
    .stats-totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #1a73e8;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .per-tag-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    .per-tag-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .per-tag-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid #e0e0e0;
    }
    .per-tag-name {
      font-weight: 500;
      color: #333;
    }
    .per-tag-stats {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:18px; font-weight:600;">Suoritukset 2026</div>
    <div class="small">Kirjaa suoritus. Yllätys osuu satunnaisesti!</div>

    <form id="f">
      <div class="secret-row">
        <div>
          <label>Salasana</label>
          <input id="secret" type="password" placeholder="Syötä salasana" required />
          <div id="secretSaved" class="secret-saved" style="display:none;">✓ Tallennettu</div>
        </div>
      </div>

      <label>Käyttäjä</label>
      <div class="user-select">
        <input type="radio" id="userSmonde" name="user" value="Smonde" required />
        <label for="userSmonde">Smonde</label>
        <input type="radio" id="userLormy" name="user" value="Lörmy" />
        <label for="userLormy">Lörmy</label>
      </div>

      <label>Laji</label>
      <div class="tag-select">
        <input type="radio" id="tagKuntosali" name="tag" value="Kuntosali" required />
        <label for="tagKuntosali">🏋️ Kuntosali</label>
        
        <input type="radio" id="tagJuoksu" name="tag" value="Juoksu" />
        <label for="tagJuoksu">🏃 Juoksu</label>
        
        <input type="radio" id="tagUinti" name="tag" value="Uinti" />
        <label for="tagUinti">🏊 Uinti</label>
        
        <input type="radio" id="tagKuntopiiri" name="tag" value="Kuntopiiri" />
        <label for="tagKuntopiiri">🔄 Kuntopiiri</label>
        
        <input type="radio" id="tagJooga" name="tag" value="Jooga" />
        <label for="tagJooga">🧘 Jooga</label>
        
        <input type="radio" id="tagPyoraily" name="tag" value="Pyöräily" />
        <label for="tagPyoraily">🚴 Pyöräily</label>
      </div>

      <div class="date-row">
        <label>Päivä</label>
        <input id="date" type="date" required />
      </div>

      <!-- Minutes section -->
      <div class="minutes-section">
        <label>Kesto (min)</label>
        <div id="minutesDisplay" class="minutes-display">0 min</div>
        
        <div class="minutes-buttons">
          <button type="button" class="btn-plus" onclick="addMinutes(1)">+1</button>
          <button type="button" class="btn-plus" onclick="addMinutes(5)">+5</button>
          <button type="button" class="btn-plus" onclick="addMinutes(10)">+10</button>
          <button type="button" class="btn-plus" onclick="addMinutes(15)">+15</button>
        </div>
        <div class="minutes-buttons" style="margin-top: 8px;">
          <button type="button" class="btn-minus" onclick="addMinutes(-1)">−1</button>
          <button type="button" class="btn-minus" onclick="addMinutes(-5)">−5</button>
          <button type="button" class="btn-minus" onclick="addMinutes(-10)">−10</button>
          <button type="button" class="btn-minus" onclick="addMinutes(-15)">−15</button>
        </div>
        <button type="button" class="minutes-reset" onclick="resetMinutes()">Nollaa</button>
      </div>

      <label>Lisähuomio (valinnainen)</label>
      <textarea id="note" placeholder="Esim. 5 km / fiilis / aika..."></textarea>

      <button type="submit">Tallenna</button>
    </form>

    <div id="status" class="status"></div>

    <!-- Surprise section -->
    <div id="memeWrap" class="memeWrap">
      <div class="memeTitle">🎉 Yllätys!</div>
      <div id="memeText"></div>
      <img id="memeImg" alt="meme" style="display:none;" />
    </div>

    <!-- Stats section -->
    <div id="statsSection" class="stats-section">
      <div class="stats-title">📊 Tilastot</div>
      
      <div class="stats-totals">
        <div class="stat-box">
          <div id="totalMinutes" class="stat-value">0</div>
          <div class="stat-label">Minuuttia yhteensä</div>
        </div>
        <div class="stat-box">
          <div id="totalCount" class="stat-value">0</div>
          <div class="stat-label">Kertaa yhteensä</div>
        </div>
      </div>

      <div class="per-tag-title">Lajeittain:</div>
      <div id="perTagList" class="per-tag-list">
        <!-- Täytetään dynaamisesti -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzBi_b_aoB6QcdvxczEYUBHBAjiziHe3BRsECU5iu1ehBXL8ktwYN2dle7ZMqDYEdWq/exec";

    // Rekisteröi service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('✅ Service Worker registered'))
        .catch(err => console.log('Service Worker error:', err));
    }

    const f = document.getElementById('f');
    const statusEl = document.getElementById('status');
    const memeWrap = document.getElementById('memeWrap');
    const memeImg = document.getElementById('memeImg');
    const memeText = document.getElementById('memeText');
    const secretInput = document.getElementById('secret');
    const secretSaved = document.getElementById('secretSaved');
    const minutesDisplay = document.getElementById('minutesDisplay');
    const statsSection = document.getElementById('statsSection');
    const totalMinutesEl = document.getElementById('totalMinutes');
    const totalCountEl = document.getElementById('totalCount');
    const perTagList = document.getElementById('perTagList');

    // Minuuttilaskuri
    let currentMinutes = 0;

    function updateMinutesDisplay() {
      minutesDisplay.textContent = currentMinutes + ' min';
    }

    function addMinutes(amount) {
      currentMinutes = Math.max(0, currentMinutes + amount);
      updateMinutesDisplay();
    }

    function resetMinutes() {
      currentMinutes = 0;
      updateMinutesDisplay();
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function showSurprise(value) {
      if (!value) return;
      
      if (value.startsWith('http')) {
        memeImg.src = value;
        memeImg.style.display = 'block';
        memeText.style.display = 'none';
        memeText.textContent = '';
      } else {
        memeText.textContent = value;
        memeText.style.display = 'block';
        memeImg.style.display = 'none';
        memeImg.src = '';
      }
      
      memeWrap.style.display = 'block';
    }

    function hideSurprise() {
      memeWrap.style.display = 'none';
      memeImg.src = '';
      memeImg.style.display = 'none';
      memeText.textContent = '';
      memeText.style.display = 'none';
    }

    function updateStats(saved) {
      // Päivitä kokonaistilastot - luetaan saved-objektista
      totalMinutesEl.textContent = saved.totalMinutes || 0;
      totalCountEl.textContent = saved.totalCount || 0;

      // Päivitä lajikohtaiset tilastot - luetaan saved.perTag
      perTagList.innerHTML = '';
      
      if (saved.perTag && saved.perTag.length > 0) {
        saved.perTag.forEach(item => {
          const div = document.createElement('div');
          div.className = 'per-tag-item';
          div.innerHTML = `
            <span class="per-tag-name">${item.tag}</span>
            <span class="per-tag-stats">${item.count} kertaa (${item.minutes} min)</span>
          `;
          perTagList.appendChild(div);
        });
      }

      // Näytä tilastot-osio
      statsSection.style.display = 'block';
    }

    function loadSecret() {
      const saved = localStorage.getItem('appSecret');
      if (saved) {
        secretInput.value = saved;
        secretSaved.style.display = 'block';
      }
    }

    function saveSecret(secret) {
      localStorage.setItem('appSecret', secret);
      secretSaved.style.display = 'block';
    }

    function getSelectedUser() {
      const selected = document.querySelector('input[name="user"]:checked');
      return selected ? selected.value : '';
    }

    function getSelectedTag() {
      const selected = document.querySelector('input[name="tag"]:checked');
      return selected ? selected.value : '';
    }

    loadSecret();
    document.getElementById('date').valueAsDate = new Date();

    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      hideSurprise();
      setStatus('Tallennetaan...');

      const secret = secretInput.value.trim();
      
      const payload = {
        secret: secret,
        user: getSelectedUser(),
        date: document.getElementById('date').value,
        tag: getSelectedTag(),
        note: document.getElementById('note').value.trim(),
        minutes: currentMinutes
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        
        if (!json.ok) {
          if (json.error === 'Unauthorized') {
            setStatus('Väärä salasana', 'error');
            localStorage.removeItem('appSecret');
            secretSaved.style.display = 'none';
          } else {
            setStatus('Virhe: ' + json.error, 'error');
          }
          return;
        }

        saveSecret(secret);

        // KORJAUS: Kaikki kentät luetaan json.saved -objektista
        const saved = json.saved;
        
        // KORJAUS: totalCount saved-objektista (ei countForUser)
        setStatus(`Tallennettu! Suorituksia: ${saved.totalCount}`, 'success');

        // KORJAUS: surpriseShown ja memeUrl luetaan saved-objektista
        if (saved.surpriseShown && saved.memeUrl) {
          showSurprise(saved.memeUrl);
        }

        // Päivitä tilastot - saved sisältää totalMinutes, totalCount, perTag
        updateStats(saved);

        // Nollaa kentät
        document.getElementById('note').value = '';
        resetMinutes();

      } catch (err) {
        setStatus('Verkkovirhe: ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
